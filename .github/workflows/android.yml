name: FEHA AI APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'FEHA_AI_STEP02_CRASHFIX.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: |
          unzip -o FEHA_AI_STEP02_CRASHFIX.zip -d project
          find project -name settings.gradle.kts

      - name: Find project directory
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDirectDebug assemblePlayDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FEHA-AI-APKs
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
